# Primary packaging: scratch GTFS-RT service plus the advisory-fetcher and track-fetcher images.
#
# Each service names its released GHCR image (linux/amd64 and linux/arm64, so a Raspberry Pi
# pulls native builds) and keeps its local build. Pull the release and start it without building:
#
#   docker compose pull && docker compose up -d
#
# `--build` builds from this checkout instead and tags the result with the same names. To keep
# local builds apart from the pulled release, give them another tag:
#
#   AMTRAK_IMAGE_TAG=local docker compose up -d --build
#
# Chromium stays in the advisory-fetcher image. The service build is the root
# Dockerfile `runtime` stage (scratch). Advisories are on in this stack and
# fail open if the fetcher is down. Track and gate assignments are on too:
# Amtrak's own track numbers and boarding gates come from the track-fetcher
# sidecar, which starts with the stack, and NJ Transit's come from RailData when
# its credentials are set. Tracks change the published static feed; see the
# README. To run without them (and without the sidecar's Chromium):
#
#   AMTRAK_TRACKS=off docker compose up -d --scale track-fetcher=0
#
# Build the images without starting them: `docker buildx bake default track-fetcher`
#
# Both browser sidecars use chromium-headless-shell. If Amtrak blocks it, rebuild them with full
# Chromium and Xvfb and run headful (larger images, more memory on a Pi):
#
#   AMTRAK_IMAGE_TAG=local FETCHER_BROWSER_BUNDLE=full FETCHER_BROWSER_MODE=xvfb-headful \
#     docker compose up -d --build
#
# Rust service alone, advisories off (image default; do not set AMTRAK_ADVISORIES):
#
#   docker build --tag amtrak-gtfs-rt:local .
#   docker run --rm --network host -v amtrak-data:/data amtrak-gtfs-rt:local

# Fixed so the stack is one project whether started here or from
# advisory-fetcher/ (whose compose file sets the same name). The volumes and the
# pinned subnet below then belong to one project, not one per directory.
name: amtrak-gtfs-rt

services:
  vehicle-positions:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/sohampatwardhan/amtrak-gtfs-rt:${AMTRAK_IMAGE_TAG:-0.7.1}
    restart: unless-stopped
    environment:
      AMTRAK_ROLE: vehicle-positions
      AMTRAK_TRACKS: ${AMTRAK_TRACKS:-on}
      AMTRAK_TRACKS_AMTRAK_URL: ""
      AMTRAK_BIND_ADDR: 0.0.0.0:8080
      AMTRAK_ALLOWED_PEER_IPS: 172.31.240.1
      AMTRAK_PUBLIC_URL: http://127.0.0.1:8090
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - amtrak-data:/data
    networks: [amtrak]

  trip-updates:
    build:
      context: .
      dockerfile: trip-updates.Dockerfile
      args:
        BROWSER_BUNDLE: ${FETCHER_BROWSER_BUNDLE:-headless-shell}
    image: ghcr.io/sohampatwardhan/amtrak-gtfs-rt-trip-updates:${AMTRAK_IMAGE_TAG:-0.7.1}
    restart: unless-stopped
    shm_size: "64mb"
    init: true
    mem_limit: 768m
    pids_limit: 256
    environment:
      AMTRAK_ROLE: trip-updates
      AMTRAK_TRACKS: ${AMTRAK_TRACKS:-on}
      AMTRAK_TRACKS_AMTRAK_URL: http://127.0.0.1:8081/tracks.json
      AMTRAK_TRACKS_BASE_INTERVAL_SECS: "900"
      POLL_INTERVAL_SECS: "60"
      BROWSER_MODE: ${FETCHER_BROWSER_MODE:-headless-shell}
      BLOCK_SUBRESOURCES: "true"
      BLOCK_THIRD_PARTY: "true"
    volumes:
      - amtrak-data:/data
    networks: [amtrak]

  alerts:
    build:
      context: .
      dockerfile: alerts.Dockerfile
      args:
        BROWSER_BUNDLE: ${FETCHER_BROWSER_BUNDLE:-headless-shell}
    image: ghcr.io/sohampatwardhan/amtrak-gtfs-rt-alerts:${AMTRAK_IMAGE_TAG:-0.7.1}
    restart: unless-stopped
    shm_size: "64mb"
    environment:
      AMTRAK_ROLE: alerts
      AMTRAK_ADVISORIES: "on"
      AMTRAK_ADVISORIES_URL: http://127.0.0.1:8080/service-alerts-and-notices
      POLL_INTERVAL_SECS: "900"
      BROWSER_MODE: ${FETCHER_BROWSER_MODE:-headless-shell}
      BLOCK_SUBRESOURCES: "true"
    volumes:
      - amtrak-data:/data
    networks: [amtrak]

networks:
  amtrak:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24
          gateway: 172.31.240.1

volumes:
  amtrak-data:
  advisory-snapshots:
