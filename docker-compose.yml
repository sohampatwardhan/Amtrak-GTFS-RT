# Primary packaging: scratch GTFS-RT service plus the advisory-fetcher image.
#
# Chromium stays in the advisory-fetcher image. The service build is the root
# Dockerfile `runtime` stage (scratch). Advisories are on in this stack and
# fail open if the fetcher is down. Track and gate assignments are on too:
# Amtrak's own track numbers and boarding gates come from the track-fetcher
# sidecar, which starts with the stack, and NJ Transit's come from RailData when
# its credentials are set. Tracks change the published static feed; see the
# README. To run without them (and without the sidecar's Chromium):
#
#   AMTRAK_TRACKS=off docker compose up -d --build --scale track-fetcher=0
#
#   docker compose up -d --build
#
# Build both images without starting them: `docker buildx bake`
#
# Both browser sidecars use chromium-headless-shell. If Amtrak blocks it, rebuild them with full
# Chromium and Xvfb and run headful (larger images, more memory on a Pi):
#
#   FETCHER_BROWSER_BUNDLE=full FETCHER_BROWSER_MODE=xvfb-headful docker compose up -d --build
#
# Rust service alone, advisories off (image default; do not set AMTRAK_ADVISORIES):
#
#   docker build --tag amtrak-gtfs-rt:local .
#   docker run --rm --network host -v amtrak-data:/data amtrak-gtfs-rt:local

# Fixed so the stack is one project whether started here or from
# advisory-fetcher/ (whose compose file sets the same name). The volumes and the
# pinned subnet below then belong to one project, not one per directory.
name: amtrak-gtfs-rt

services:
  advisory-fetcher:
    build:
      context: ./advisory-fetcher
      dockerfile: Dockerfile
      args:
        BROWSER_BUNDLE: ${FETCHER_BROWSER_BUNDLE:-headless-shell}
    image: advisory-fetcher:local
    restart: unless-stopped
    # Chromium is launched with --disable-dev-shm-usage, so it does not need a 1 GB /dev/shm.
    shm_size: "64mb"
    environment:
      POLL_INTERVAL_SECS: "900"
      BROWSER_MODE: ${FETCHER_BROWSER_MODE:-headless-shell}
      BLOCK_SUBRESOURCES: "true"
    volumes:
      - advisory-snapshots:/snapshot
    networks: [amtrak]

  track-fetcher:
    build:
      context: ./track-fetcher
      dockerfile: Dockerfile
      args:
        BROWSER_BUNDLE: ${FETCHER_BROWSER_BUNDLE:-headless-shell}
    image: track-fetcher:local
    restart: unless-stopped
    shm_size: "64mb"
    # Chromium runs Amtrak's page scripts without its own sandbox, so the container is the
    # boundary: read-only root, no capabilities, bounded memory and processes, and no published
    # port (only amtrak-gtfs-rt reaches it on the internal network).
    read_only: true
    tmpfs:
      - /tmp
      - /home/fetcher
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 768m
    pids_limit: 256
    environment:
      POLL_INTERVAL_SECS: "60"
      BROWSER_MODE: ${FETCHER_BROWSER_MODE:-headless-shell}
      BLOCK_SUBRESOURCES: "true"
      BLOCK_THIRD_PARTY: "true"
    networks: [amtrak]

  amtrak-gtfs-rt:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: amtrak-gtfs-rt:local
    restart: unless-stopped
    depends_on: [advisory-fetcher]
    environment:
      AMTRAK_ADVISORIES: "on"
      AMTRAK_ADVISORIES_URL: http://advisory-fetcher:8080/service-alerts-and-notices
      # On unless the operator sets `off`.
      AMTRAK_TRACKS: ${AMTRAK_TRACKS:-on}
      # Amtrak's own track numbers and gates, from the track-fetcher sidecar. Read only while
      # tracks are on. Set it explicitly empty to skip Amtrak's status and use only the other boards.
      AMTRAK_TRACKS_AMTRAK_URL: ${AMTRAK_TRACKS_AMTRAK_URL-http://track-fetcher:8081/tracks.json}
      # Published on host loopback port 8090 (8080 is often taken on the host).
      # The container sees that traffic from the bridge gateway of the pinned
      # subnet below, not from 127.0.0.1.
      AMTRAK_BIND_ADDR: 0.0.0.0:8080
      AMTRAK_ALLOWED_PEER_IPS: 172.31.240.1
      # What the startup banner prints as the base URL; the container cannot see the host port.
      AMTRAK_PUBLIC_URL: http://127.0.0.1:8090
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - amtrak-data:/data
    networks: [amtrak]

networks:
  amtrak:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24
          gateway: 172.31.240.1

volumes:
  amtrak-data:
  advisory-snapshots:
