name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable semantic-version tag to recover
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sohampatwardhan/amtrak-gtfs-rt

jobs:
  release-context:
    name: Resolve immutable release context
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
      release_revision: ${{ steps.verify.outputs.revision }}
      control_revision: ${{ steps.control.outputs.revision }}
      manifest_state: ${{ steps.manifest.outputs.state }}
      amd64_digest: ${{ steps.manifest.outputs.amd64_digest }}
      arm64_digest: ${{ steps.manifest.outputs.arm64_digest }}
    steps:
      # Manual recovery executes corrected controls from main while all payload,
      # metadata, licenses, and build inputs come from the immutable tag checkout.
      - name: Check out the control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0

      - name: Record the control revision
        id: control
        shell: bash
        run: printf 'revision=%s\n' "$(git -C control rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Select the requested immutable tag
        id: select
        shell: bash
        run: |
          # The helper rejects manual recovery unless github.ref is exactly refs/heads/main.
          control/scripts/release-context.sh select \
            "${{ github.event_name }}" \
            "${{ github.ref_name }}" \
            "${{ github.event.inputs.tag }}" \
            "${{ github.ref }}" \
            "${{ github.event.repository.default_branch }}" \
            "$GITHUB_OUTPUT"

      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.tag }}
          path: source
          fetch-depth: 0

      - name: Verify tagged source and release metadata
        id: verify
        shell: bash
        run: control/scripts/release-context.sh verify "${{ steps.select.outputs.tag }}" source "$GITHUB_OUTPUT"

      - name: Anchor a tag push to its triggering commit
        if: github.event_name == 'push'
        env:
          RELEASE_REVISION: ${{ steps.verify.outputs.revision }}
        shell: bash
        run: test "$RELEASE_REVISION" = "${{ github.sha }}"

      - name: Log in to GitHub Container Registry for inspection
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx for manifest inspection
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve one coherent existing-manifest state
        id: manifest
        env:
          VERSION: ${{ steps.select.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/manifest-inspect.err"
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
            >"$RUNNER_TEMP/manifest.json" 2>"$error_file"; then
            if grep -Eqi 'manifest unknown|not found' "$error_file"; then
              printf 'state=absent\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$error_file" >&2
            exit 1
          fi

          jq -e '
            (.manifests | type == "array" and length == 2) and
            ([.manifests[] | .platform.os + "/" + .platform.architecture] | sort
              == ["linux/amd64", "linux/arm64"]) and
            all(.manifests[]; (.digest | test("^sha256:[0-9a-f]{64}$")))
          ' "$RUNNER_TEMP/manifest.json" >/dev/null
          amd64="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$RUNNER_TEMP/manifest.json")"
          arm64="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "$RUNNER_TEMP/manifest.json")"
          test "$amd64" != "$arm64"
          printf 'state=exact\namd64_digest=%s\narm64_digest=%s\n' "$amd64" "$arm64" >>"$GITHUB_OUTPUT"

  validate-platform:
    name: Validate ${{ matrix.platform }}
    needs: release-context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            slug: linux-amd64
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64

    steps:
      - name: Check out the control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0

      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.release_revision }}
          path: source
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push the canonical platform digest
        id: build
        if: needs.release-context.outputs.manifest_state == 'absent'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: source
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            OCI_VERSION=${{ needs.release-context.outputs.version }}
            OCI_REVISION=${{ needs.release-context.outputs.release_revision }}
          # Keep this output as a platform manifest digest. BuildKit attestations turn a
          # single-platform result into an OCI index, which cannot safely serve as an input to
          # the later two-platform manifest assembly. Exact SBOM attestations are attached after
          # the digest passes the native smoke and scan gates.
          sbom: false
          provenance: false

      - name: Select this platform's exact digest
        id: candidate
        env:
          EXISTING_DIGEST: ${{ matrix.arch == 'amd64' && needs.release-context.outputs.amd64_digest || needs.release-context.outputs.arm64_digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          MANIFEST_STATE: ${{ needs.release-context.outputs.manifest_state }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MANIFEST_STATE" = exact ]; then digest="$EXISTING_DIGEST"; else digest="$BUILT_DIGEST"; fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Pull and verify exact image identity
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          LOCAL_IMAGE: amtrak-gtfs-rt:release-${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$LOCAL_IMAGE"
          source/scripts/verify-release-image.sh "$LOCAL_IMAGE" \
            "${{ needs.release-context.outputs.version }}" \
            "${{ needs.release-context.outputs.release_revision }}" \
            "${{ matrix.arch }}"

      - name: Prepare diagnostic namespaces
        shell: bash
        run: mkdir -p release-evidence release-diagnostics/${{ matrix.slug }} digests

      - name: Smoke-test the exact digest before installing release scanners
        env:
          LOCAL_IMAGE: amtrak-gtfs-rt:release-${{ matrix.slug }}
        shell: bash
        run: |
          set +e
          source/scripts/test-container.sh "$LOCAL_IMAGE"
          smoke_status=$?
          set -e
          if [ -d source/validation-reports/container ]; then
            mv source/validation-reports/container \
              release-diagnostics/${{ matrix.slug }}/smoke-noncanonical
          fi
          exit "$smoke_status"

      - name: Install checksum-pinned release scanners
        shell: bash
        run: |
          source/scripts/install-release-scanners.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >>"$GITHUB_PATH"

      - name: Generate and atomically stage canonical evidence
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          LOCAL_IMAGE: amtrak-gtfs-rt:release-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          sbom_tmp="release-diagnostics/$SLUG/sbom.partial.json"
          grype_tmp="release-diagnostics/$SLUG/grype.partial.json"
          syft "$LOCAL_IMAGE" -o spdx-json="$sbom_tmp"
          control/scripts/release-vulnerability-policy.sh validate-sbom "$sbom_tmp"
          mv "$sbom_tmp" "release-evidence/$SLUG-sbom.spdx.json"

          grype "$LOCAL_IMAGE" -o json >"$grype_tmp"
          control/scripts/release-vulnerability-policy.sh summarize "$grype_tmp" \
            "release-evidence/$SLUG-cves-grype.txt"
          mv "$grype_tmp" "release-evidence/$SLUG-cves-grype.json"

          control/scripts/release-vulnerability-policy.sh write-digest "$DIGEST" "digests/$SLUG"
          control/scripts/release-vulnerability-policy.sh write-digest "$DIGEST" \
            "release-evidence/$SLUG-image-digest.txt"
          docker image inspect "$LOCAL_IMAGE" >"release-evidence/$SLUG-image-inspect.json"

      - name: Upload complete exact-digest evidence before policy enforcement
        id: full_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-platform-${{ matrix.slug }}
          path: |
            digests/${{ matrix.slug }}
            release-evidence/${{ matrix.slug }}-*
          if-no-files-found: error
          retention-days: 30

      - name: Retain partial diagnostics after an earlier failure
        if: always() && steps.full_upload.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-platform-${{ matrix.slug }}-partial-${{ github.run_attempt }}
          path: |
            release-diagnostics/${{ matrix.slug }}
            release-evidence/${{ matrix.slug }}-*
            digests/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce the retained zero-match policy
        shell: bash
        run: control/scripts/release-vulnerability-policy.sh enforce release-evidence/${{ matrix.slug }}-cves-grype.json

      - name: Attest the clean exact-platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          sbom-path: release-evidence/${{ matrix.slug }}-sbom.spdx.json
          push-to-registry: true

  publish:
    name: Publish verified release
    needs: [release-context, validate-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.release_revision }}
          path: source

      - name: Download amd64 exact-digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-platform-linux-amd64
          path: .

      - name: Download arm64 exact-digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-platform-linux-arm64
          path: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Assemble or verify immutable manifest tags
        id: manifest
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
          EXPECTED_STATE: ${{ needs.release-context.outputs.manifest_state }}
        shell: bash
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          amd64_digest="$(cat digests/linux-amd64)"
          arm64_digest="$(cat digests/linux-arm64)"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64_digest" != "$arm64_digest"

          if [ "$EXPECTED_STATE" = absent ]; then
            error_file="$RUNNER_TEMP/precreate-manifest.err"
            if docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
              >"$RUNNER_TEMP/precreate-manifest.json" 2>"$error_file"; then
              printf 'Immutable version tag appeared after context resolution; refusing to overwrite it.\n' >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            docker buildx imagetools create \
              --tag "$IMAGE:$VERSION" \
              --tag "$IMAGE:$minor" \
              --tag "$IMAGE:latest" \
              "$IMAGE@$amd64_digest" \
              "$IMAGE@$arm64_digest"
          fi

          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw >manifest.json
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            (.manifests | type == "array" and length == 2) and
            ([.manifests[] | .platform.os + "/" + .platform.architecture] | sort
              == ["linux/amd64", "linux/arm64"]) and
            ([.manifests[].digest] | sort == ([$amd64, $arm64] | sort))
          ' manifest.json >/dev/null

          manifest_digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          for tag in "$minor" latest; do
            resolved="$(docker buildx imagetools inspect "$IMAGE:$tag" \
              | awk '$1 == "Digest:" { print $2; exit }')"
            test "$resolved" = "$manifest_digest"
          done

          printf 'digest=%s\n' "$manifest_digest" >>"$GITHUB_OUTPUT"

      - name: Attest the multi-platform manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
          TAG: ${{ needs.release-context.outputs.tag }}
          VERSION: ${{ needs.release-context.outputs.version }}
          RELEASE_REVISION: ${{ needs.release-context.outputs.release_revision }}
          CONTROL_REVISION: ${{ needs.release-context.outputs.control_revision }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          amd64_digest="$(cat ../digests/linux-amd64)"
          arm64_digest="$(cat ../digests/linux-arm64)"
          scripts/extract-release-notes.sh "$VERSION" ../release-notes.md

          {
            printf 'Image: %s\n' "$IMAGE"
            printf 'Tag: %s\n' "$TAG"
            printf 'Release revision: %s\n' "$RELEASE_REVISION"
            printf 'Control revision: %s\n' "$CONTROL_REVISION"
            printf 'Version tag: %s:%s\n' "$IMAGE" "$VERSION"
            printf 'Minor tag: %s:%s\n' "$IMAGE" "$minor"
            printf 'Convenience tag: %s:latest\n' "$IMAGE"
            printf 'Manifest digest: %s\n' "$MANIFEST_DIGEST"
            printf 'linux/amd64 digest: %s\n' "$amd64_digest"
            printf 'linux/arm64 digest: %s\n' "$arm64_digest"
            printf '\nPull by immutable digest:\n'
            printf 'docker pull %s@%s\n' "$IMAGE" "$MANIFEST_DIGEST"
            printf '\nPull by version:\n'
            printf 'docker pull %s:%s\n' "$IMAGE" "$VERSION"
          } >../image-release.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$TAG" \
              --pattern image-release.txt --dir "$existing_dir"
            cmp ../image-release.txt "$existing_dir/image-release.txt"
            printf 'Existing release evidence matches this immutable rerun.\n'
            exit 0
          fi

          mapfile -d '' evidence_assets < <(find ../release-evidence -type f -print0 | sort -z)
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file ../release-notes.md \
            LICENSE THIRD_PARTY_LICENSES.html ../image-release.txt \
            "${evidence_assets[@]}"
