name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sohampatwardhan/amtrak-gtfs-rt

jobs:
  validate-platform:
    name: Validate ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            slug: linux-amd64
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Ref is not an exact semantic-version release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          scripts/check-release-metadata.sh "$version" "$GITHUB_REF_NAME"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve an already-published immutable platform digest
        id: existing
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! docker buildx imagetools inspect "$IMAGE:$version" --raw \
            >"$RUNNER_TEMP/existing-manifest.json" 2>/dev/null; then
            printf 'found=false\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          digest="$(jq -er --arg platform "$PLATFORM" '
            [.manifests[]
              | select((.platform.os + "/" + .platform.architecture) == $platform)
              | .digest]
            | if length == 1 then .[0] else error("expected one platform digest") end
          ' "$RUNNER_TEMP/existing-manifest.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'found=true\n' >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Build and push the canonical platform digest
        id: build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            OCI_VERSION=${{ steps.release.outputs.version }}
            OCI_REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Pull the exact digest for native validation
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          LOCAL_IMAGE: amtrak-gtfs-rt:release-${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$LOCAL_IMAGE"

      - name: Install checksum-pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          scripts/install-release-scanners.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >>"$GITHUB_PATH"

      - name: Smoke-test and scan the exact platform digest
        env:
          LOCAL_IMAGE: amtrak-gtfs-rt:release-${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-container.sh "$LOCAL_IMAGE"

          report_dir="validation-reports/container"
          syft "$LOCAL_IMAGE" -o spdx-json="$report_dir/sbom.spdx.json"
          grype "$LOCAL_IMAGE" -o json >"$report_dir/cves-grype.json"
          grype "$LOCAL_IMAGE" -o table >"$report_dir/cves-grype.txt"

          test -s "$report_dir/sbom.spdx.json"
          test -s "$report_dir/cves-grype.json"
          jq -e '.matches | type == "array" and length == 0' \
            "$report_dir/cves-grype.json" >/dev/null
          jq -e '.spdxVersion and (.packages | type == "array" and length > 0)' \
            "$report_dir/sbom.spdx.json" >/dev/null
          scripts/verify-release-image.sh "$LOCAL_IMAGE" \
            "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" "${{ matrix.arch }}"

      - name: Stage exact-digest evidence
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          LOCAL_IMAGE: amtrak-gtfs-rt:release-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence digests
          printf '%s\n' "$DIGEST" >"digests/$SLUG"
          cp validation-reports/container/sbom.spdx.json \
            "release-evidence/$SLUG-sbom.spdx.json"
          cp validation-reports/container/cves-grype.json \
            "release-evidence/$SLUG-cves-grype.json"
          cp validation-reports/container/cves-grype.txt \
            "release-evidence/$SLUG-cves-grype.txt"
          docker image inspect "$LOCAL_IMAGE" \
            >"release-evidence/$SLUG-image-inspect.json"
          printf '%s\n' "$DIGEST" \
            >"release-evidence/$SLUG-image-digest.txt"

      - name: Upload exact-digest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-platform-${{ matrix.slug }}
          path: |
            digests/${{ matrix.slug }}
            release-evidence/${{ matrix.slug }}-*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified release
    needs: validate-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all exact-digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-platform-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Assemble or verify immutable manifest tags
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          amd64_digest="$(cat digests/linux-amd64)"
          arm64_digest="$(cat digests/linux-arm64)"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64_digest" != "$arm64_digest"

          created=false
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            printf 'Version tag already exists; verifying immutable rerun state.\n'
          else
            if docker buildx imagetools inspect "$IMAGE:$minor" >/dev/null 2>&1 || \
               docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
              printf 'A moving tag exists without the immutable version tag; refusing publication.\n' >&2
              exit 1
            fi
            docker buildx imagetools create \
              --tag "$IMAGE:$version" \
              --tag "$IMAGE:$minor" \
              --tag "$IMAGE:latest" \
              "$IMAGE@$amd64_digest" \
              "$IMAGE@$arm64_digest"
            created=true
          fi

          docker buildx imagetools inspect "$IMAGE:$version" --raw >manifest.json
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            ([.manifests[]
              | select(.platform.os == "linux")
              | (.platform.os + "/" + .platform.architecture)] | sort)
              == ["linux/amd64", "linux/arm64"]
            and ([.manifests[].digest] | index($amd64) != null)
            and ([.manifests[].digest] | index($arm64) != null)
          ' manifest.json >/dev/null

          manifest_digest="$(docker buildx imagetools inspect "$IMAGE:$version" \
            | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          for tag in "$minor" latest; do
            resolved="$(docker buildx imagetools inspect "$IMAGE:$tag" \
              | awk '$1 == "Digest:" { print $2; exit }')"
            test "$resolved" = "$manifest_digest"
          done

          printf 'digest=%s\n' "$manifest_digest" >>"$GITHUB_OUTPUT"
          printf 'created=%s\n' "$created" >>"$GITHUB_OUTPUT"

      - name: Attest the multi-platform manifest
        if: steps.manifest.outputs.created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          amd64_digest="$(cat digests/linux-amd64)"
          arm64_digest="$(cat digests/linux-arm64)"
          scripts/extract-release-notes.sh "$version" release-notes.md

          {
            printf 'Image: %s\n' "$IMAGE"
            printf 'Version tag: %s:%s\n' "$IMAGE" "$version"
            printf 'Minor tag: %s:%s\n' "$IMAGE" "$minor"
            printf 'Convenience tag: %s:latest\n' "$IMAGE"
            printf 'Manifest digest: %s\n' "$MANIFEST_DIGEST"
            printf 'linux/amd64 digest: %s\n' "$amd64_digest"
            printf 'linux/arm64 digest: %s\n' "$arm64_digest"
            printf '\nPull by immutable digest:\n'
            printf 'docker pull %s@%s\n' "$IMAGE" "$MANIFEST_DIGEST"
            printf '\nPull by version:\n'
            printf 'docker pull %s:%s\n' "$IMAGE" "$version"
          } >image-release.txt

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$GITHUB_REF_NAME" \
              --pattern image-release.txt --dir "$existing_dir"
            cmp image-release.txt "$existing_dir/image-release.txt"
            printf 'Existing release evidence matches this immutable rerun.\n'
            exit 0
          fi

          mapfile -d '' evidence_assets < <(find release-evidence -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            LICENSE THIRD_PARTY_LICENSES.html image-release.txt \
            "${evidence_assets[@]}"
