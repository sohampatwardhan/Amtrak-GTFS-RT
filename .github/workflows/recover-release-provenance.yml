name: Recover release provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable release tag
        required: true
        type: string
      manifest_digest:
        description: Exact released OCI manifest digest
        required: true
        type: string
      original_run_id:
        description: Successful tag-triggered Release workflow run ID
        required: true
        type: string

concurrency:
  group: recover-release-provenance-${{ inputs.tag }}-${{ inputs.manifest_digest }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/sohampatwardhan/amtrak-gtfs-rt

jobs:
  verify-and-attest:
    name: Verify and attest existing release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Validate recovery inputs and original release run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ORIGINAL_RUN_ID" =~ ^[0-9]+$ ]]

          version="${TAG#v}"
          scripts/check-release-metadata.sh "$version" "$TAG"
          release_sha="$(git rev-parse HEAD)"
          run_json="$RUNNER_TEMP/original-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID" >"$run_json"
          jq -e --arg tag "$TAG" --arg sha "$release_sha" '
            .event == "push"
            and .name == "Release"
            and .path == ".github/workflows/release.yml"
            and .head_branch == $tag
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
          ' "$run_json" >/dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify immutable manifest and release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          minor="${version%.*}"
          evidence_dir="$RUNNER_TEMP/release-evidence"
          mkdir -p "$evidence_dir"
          gh release download "$TAG" --pattern image-release.txt --dir "$evidence_dir"

          grep -Fqx "Manifest digest: $MANIFEST_DIGEST" \
            "$evidence_dir/image-release.txt"
          amd64_digest="$(awk '$1 == "linux/amd64" && $2 == "digest:" {print $3}' \
            "$evidence_dir/image-release.txt")"
          arm64_digest="$(awk '$1 == "linux/arm64" && $2 == "digest:" {print $3}' \
            "$evidence_dir/image-release.txt")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64_digest" != "$arm64_digest"

          docker buildx imagetools inspect "$IMAGE@$MANIFEST_DIGEST" --raw \
            >"$RUNNER_TEMP/manifest.json"
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            ([.manifests[]
              | select(.platform.os == "linux")
              | (.platform.os + "/" + .platform.architecture)] | sort)
              == ["linux/amd64", "linux/arm64"]
            and ([.manifests[].digest] | sort) == ([$amd64, $arm64] | sort)
          ' "$RUNNER_TEMP/manifest.json" >/dev/null

          for tag in "$version" "$minor" latest; do
            resolved="$(docker buildx imagetools inspect "$IMAGE:$tag" \
              | awk '$1 == "Digest:" {print $2; exit}')"
            test "$resolved" = "$MANIFEST_DIGEST"
          done

      - name: Attest the verified existing manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ inputs.manifest_digest }}
          push-to-registry: true
