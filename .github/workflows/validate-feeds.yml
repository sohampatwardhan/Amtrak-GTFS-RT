name: Validate feeds

# Spec-compliance gate: generates real feeds and runs MobilityData's GTFS and
# GTFS-Realtime validators against them, failing on any ERROR code not recorded
# in validation/baseline.json.
#
# This is deliberately NOT part of the pull-request CI: it fetches live data
# from Amtrak, so an upstream outage would otherwise block unrelated PRs. It
# runs on a schedule, on pushes that touch the pipeline, and on demand.

on:
  schedule:
    # 09:17 UTC daily — off the hour to avoid the scheduler's busiest minutes.
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/validate-feeds.sh"
      - "scripts/test-live-amtrak.sh"
      - "validation/baseline.json"
      - ".github/workflows/validate-feeds.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  live-amtrak:
    name: Live Amtrak ingestion and Protobuf conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Independent of MobilityData tooling/baseline failures. An upstream failure
    # is a failed live check, never a passing offline check or a skipped test.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test live fetch and all three Protobuf products
        env:
          RUST_BACKTRACE: "1"
        run: bash scripts/test-live-amtrak.sh

      - name: Upload live test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-amtrak-${{ github.run_attempt }}
          path: validation-reports/live-amtrak/
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: GTFS + GTFS-RT validators
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        # The gtfs-realtime crate's build script generates Rust bindings from
        # .proto files and requires the protobuf compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Java 17
        # Both validators require Java 17 (the RT validator's README saying 11 is stale).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache validator jars
        uses: actions/cache@v4
        with:
          path: .validator-cache
          # Keyed on the script, which pins both validator versions.
          key: validators-${{ hashFiles('scripts/validate-feeds.sh') }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('scripts/validate-feeds.sh') }}
          restore-keys: maven-

      - name: Run validation gate
        run: ./scripts/validate-feeds.sh

      # Same gate with platform stops and track assignments enabled. It runs
      # without RailData credentials on purpose: a fresh runner has no token
      # cache, so sharing production credentials would spend NJ Transit's 10
      # daily token requests. The augmented static feed and Hartford Line
      # assignments are still validated.
      - name: Run validation gate with track assignments
        if: always()
        run: ./scripts/validate-feeds.sh --tracks

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: validation-reports/
          retention-days: 14
