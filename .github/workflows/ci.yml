name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        # The gtfs-realtime crate's build script generates Rust bindings from
        # .proto files and requires the protobuf compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        # Live tests against Amtrak's endpoints are #[ignore]d, so this job stays
        # deterministic and offline. They run in the validate-feeds workflow.
        run: cargo test --verbose

  advisory-fetcher-tests:
    name: Advisory fetcher offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
          cache: pip
          cache-dependency-path: advisory-fetcher/requirements.txt

      - name: Install exact test dependencies
        run: python -m pip install --requirement advisory-fetcher/requirements.txt

      - name: Run offline unit tests
        working-directory: advisory-fetcher
        run: python -m pytest tests -q

  track-fetcher-tests:
    name: Track fetcher offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
          cache: pip
          cache-dependency-path: track-fetcher/requirements.txt

      - name: Install exact test dependencies
        run: python -m pip install --requirement track-fetcher/requirements.txt

      - name: Run offline unit tests
        working-directory: track-fetcher
        run: python -m pytest tests -q

  fetcher-images:
    name: ${{ matrix.image }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [advisory-fetcher, track-fetcher]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native builds on each architecture, so the Dockerfile's ldd checks run on arm64 too. The
      # full bundle is the xvfb-headful fallback; building it here keeps that mode working.
      - name: Build the default (headless-shell) image
        run: docker build --tag fetcher:shell ${{ matrix.image }}

      - name: Build the full (Chromium and Xvfb) image
        run: docker build --build-arg BROWSER_BUNDLE=full --tag fetcher:full ${{ matrix.image }}

      - name: Import the fetcher and Playwright inside the images
        run: |
          for tag in shell full; do
            docker run --rm --entrypoint python "fetcher:${tag}" \
              -c "import playwright.async_api, fetcher.__main__"
          done

      - name: Start Xvfb in the full image
        run: |
          docker run --rm --entrypoint python fetcher:full -c \
            "from fetcher.display import start_virtual_display, stop_virtual_display; stop_virtual_display(start_virtual_display('xvfb-headful', {}))"

  repository-controls:
    name: Repository release-control tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic release-control fixtures
        run: scripts/test-release-controls.sh

  packaging:
    name: Compose and bake config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate root compose and bake targets
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f advisory-fetcher/docker-compose.yml config >/dev/null
          docker buildx bake --print >/dev/null
