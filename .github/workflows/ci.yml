name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        # The gtfs-realtime crate's build script generates Rust bindings from
        # .proto files and requires the protobuf compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        # Live tests against Amtrak's endpoints are #[ignore]d, so this job stays
        # deterministic and offline. They run in the validate-feeds workflow.
        run: cargo test --verbose

  advisory-fetcher-tests:
    name: Advisory fetcher offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
          cache: pip
          cache-dependency-path: advisory-fetcher/requirements.txt

      - name: Install exact test dependencies
        run: python -m pip install --requirement advisory-fetcher/requirements.txt

      - name: Run offline unit tests
        working-directory: advisory-fetcher
        run: python -m pytest tests -q

  repository-controls:
    name: Repository release-control tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic release-control fixtures
        run: scripts/test-release-controls.sh

  packaging:
    name: Compose and bake config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate root compose and bake targets
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f advisory-fetcher/docker-compose.yml config >/dev/null
          docker buildx bake --print >/dev/null
