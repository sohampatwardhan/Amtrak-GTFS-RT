name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        # The gtfs-realtime crate's build script generates Rust bindings from
        # .proto files and requires the protobuf compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        # Live tests against Amtrak's endpoints are #[ignore]d, so this job stays
        # deterministic and offline. They run in the validate-feeds workflow.
        run: cargo test --verbose
